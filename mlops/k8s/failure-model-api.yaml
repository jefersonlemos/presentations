apiVersion: v1
kind: Namespace
metadata:
  name: mlops-poc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: failure-model-api-config
  namespace: mlops-poc
data:
  KSERVE_INFER_URL: http://failure-model-predictor.mlops-poc.svc.cluster.local/v2/models/failure-model/infer
  MODEL_CLASSES: crash_loop,healthy,image_pull_error,oom_killed,probe_failure,scheduling_failure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failure-model-api
  namespace: mlops-poc
  labels:
    app: failure-model-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failure-model-api
  template:
    metadata:
      labels:
        app: failure-model-api
    spec:
      containers:
        - name: api
          # Build and push a new API proxy image before applying this manifest.
          image: ttl.sh/failure-model-api-quality-20260609:24h
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: failure-model-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: failure-model-api
  namespace: mlops-poc
  labels:
    app: failure-model-api
spec:
  type: ClusterIP
  selector:
    app: failure-model-api
  ports:
    - name: http
      port: 80
      targetPort: http
