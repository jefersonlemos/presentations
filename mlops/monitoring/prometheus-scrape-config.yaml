# Scrape jobs for the Kubernetes failure prediction POC.
# This block is also embedded in k8s/prometheus-values.yaml under extraScrapeConfigs.
- job_name: failure-model-api
  metrics_path: /metrics
  static_configs:
    - targets:
        - failure-model-api.mlops-poc.svc.cluster.local:80
      labels:
        namespace: mlops-poc
        service: failure-model-api
        component: fastapi

- job_name: failure-model-kserve
  metrics_path: /metrics
  static_configs:
    - targets:
        - failure-model-predictor.mlops-poc.svc.cluster.local:80
      labels:
        namespace: mlops-poc
        service: failure-model-predictor
        component: kserve
