# PIPELINE DEFINITION
# Name: kubernetes-failure-prediction
# Inputs:
#    feature_set: str [Default: 'events']
#    inferenceservice_name: str [Default: 'failure-model']
#    minimum_f1_weighted: float [Default: 0.8]
#    model_bucket: str [Default: 'mlops-models']
#    model_object_prefix: str [Default: 'failure-model/events']
#    n_estimators: int [Default: 200.0]
#    predict_url: str [Default: 'http://failure-model-api.mlops-poc.svc.cluster.local/predict']
#    run_name: str [Default: 'kubeflow-random-forest-events']
#    s3_access_key_id: str [Default: 'minioadmin']
#    s3_endpoint_url: str [Default: 'http://minio.mlops-poc.svc.cluster.local:9000']
#    s3_secret_access_key: str [Default: 'minioadmin']
#    serving_namespace: str [Default: 'mlops-poc']
#    source_data_path: str [Default: 'data/kubernetes_failures.csv']
#    tracking_uri: str [Default: 'http://mlflow.mlops-poc.svc.cluster.local:5000']
components:
  comp-deploy-inferenceservice:
    executorLabel: exec-deploy-inferenceservice
    inputDefinitions:
      artifacts:
        publish_result:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        inferenceservice_name:
          parameterType: STRING
        namespace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        deployment_result:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model_artifacts:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-prepare-data:
    executorLabel: exec-prepare-data
    inputDefinitions:
      parameters:
        source_data_path:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-prepare-deployment:
    executorLabel: exec-prepare-deployment
    inputDefinitions:
      artifacts:
        decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        model_artifacts:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        bucket:
          parameterType: STRING
        model_object_prefix:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        deployment_manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-publish-selected-model:
    executorLabel: exec-publish-selected-model
    inputDefinitions:
      artifacts:
        decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        model_artifacts:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        access_key_id:
          parameterType: STRING
        bucket:
          parameterType: STRING
        endpoint_url:
          parameterType: STRING
        model_object_prefix:
          parameterType: STRING
        secret_access_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        publish_result:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-select-model:
    executorLabel: exec-select-model
    inputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_artifacts:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        minimum_f1_weighted:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-smoke-test-serving:
    executorLabel: exec-smoke-test-serving
    inputDefinitions:
      artifacts:
        publish_result:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        predict_url:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        smoke_test_result:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        feature_set:
          parameterType: STRING
        n_estimators:
          parameterType: NUMBER_INTEGER
        run_name:
          parameterType: STRING
        tracking_uri:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model_artifacts:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-deploy-inferenceservice:
      container:
        args:
        - "import datetime,json,ssl,sys,time,urllib.request;result=json.load(open(sys.argv[1]));namespace=sys.argv[2];name=sys.argv[3];out={'selected':\
          \ result['selected'],'published': result['published'],'storage_uri': result['storage_uri'],'deployed':\
          \ False};\nif result['published']:\n    token=open('/var/run/secrets/kubernetes.io/serviceaccount/token').read();ca='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt';url='https://kubernetes.default.svc/apis/serving.kserve.io/v1beta1/namespaces/'+namespace+'/inferenceservices/'+name;patch={'metadata':{'annotations':{'mlops-poc/model-published-at':datetime.datetime.now(datetime.timezone.utc).isoformat()}},'spec':{'predictor':{'model':{'storageUri':result['storage_uri']}}}};headers={'Authorization':'Bearer\
          \ '+token,'Content-Type':'application/merge-patch+json'};context=ssl.create_default_context(cafile=ca);request=urllib.request.Request(url,data=json.dumps(patch).encode(),headers=headers,method='PATCH');response=json.load(urllib.request.urlopen(request,context=context,timeout=30));generation=response['metadata']['generation'];deadline=time.time()+300;\n\
          \    while time.time() < deadline:\n        get_request=urllib.request.Request(url,headers={'Authorization':'Bearer\
          \ '+token});current=json.load(urllib.request.urlopen(get_request,context=context,timeout=30));ready=next((c\
          \ for c in current.get('status',{}).get('conditions',[]) if c.get('type')=='Ready'),{});\n\
          \        if current.get('status',{}).get('observedGeneration',0) >= generation\
          \ and ready.get('status')=='True':\n            out.update({'deployed':True,'generation':generation});break\n\
          \        time.sleep(5)\n    if not out['deployed']: raise TimeoutError('InferenceService\
          \ did not become ready')\njson.dump(out,open(sys.argv[4],'w'),indent=2)"
        - '{{$.inputs.artifacts[''publish_result''].path}}'
        - '{{$.inputs.parameters[''namespace'']}}'
        - '{{$.inputs.parameters[''inferenceservice_name'']}}'
        - '{{$.outputs.artifacts[''deployment_result''].path}}'
        command:
        - python3
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-evaluate-model:
      container:
        args:
        - cp "$0/metrics.json" "$1"
        - '{{$.inputs.artifacts[''model_artifacts''].path}}'
        - '{{$.outputs.artifacts[''metrics''].path}}'
        command:
        - sh
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-prepare-data:
      container:
        args:
        - mkdir -p $(dirname "$1") && cp "$0" "$1"
        - '{{$.inputs.parameters[''source_data_path'']}}'
        - '{{$.outputs.artifacts[''prepared_data''].path}}'
        command:
        - sh
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-prepare-deployment:
      container:
        args:
        - import json,sys;decision=json.load(open(sys.argv[2]));storage_uri='s3://'
          + sys.argv[3].strip('/') + '/' + sys.argv[4].strip('/') + '/';manifest='SELECTED='
          + str(decision['selected']).lower() + '\n'+ 'MODEL_PATH=' + sys.argv[1]
          + '/model.joblib\n'+ 'STORAGE_URI=' + storage_uri + '\n';open(sys.argv[5],
          'w').write(manifest)
        - '{{$.inputs.artifacts[''model_artifacts''].path}}'
        - '{{$.inputs.artifacts[''decision''].path}}'
        - '{{$.inputs.parameters[''bucket'']}}'
        - '{{$.inputs.parameters[''model_object_prefix'']}}'
        - '{{$.outputs.artifacts[''deployment_manifest''].path}}'
        command:
        - python3
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-publish-selected-model:
      container:
        args:
        - "import json,subprocess,sys;decision=json.load(open(sys.argv[2]));bucket=sys.argv[3];prefix=sys.argv[4].strip('/');storage_uri='s3://'\
          \ + bucket + '/' + prefix + '/';result={'selected': decision['selected'],\
          \ 'published': False, 'storage_uri': storage_uri, 'f1_weighted': decision['f1_weighted']};\n\
          if decision['selected']:\n    subprocess.check_call(['python3','src/publish_model_to_minio.py','--model-path',sys.argv[1]\
          \ + '/model.joblib','--bucket',bucket,'--key',prefix + '/model.joblib','--endpoint-url',sys.argv[5],'--access-key-id',sys.argv[6],'--secret-access-key',sys.argv[7]]);result['published']=True\n\
          json.dump(result, open(sys.argv[8], 'w'), indent=2)"
        - '{{$.inputs.artifacts[''model_artifacts''].path}}'
        - '{{$.inputs.artifacts[''decision''].path}}'
        - '{{$.inputs.parameters[''bucket'']}}'
        - '{{$.inputs.parameters[''model_object_prefix'']}}'
        - '{{$.inputs.parameters[''endpoint_url'']}}'
        - '{{$.inputs.parameters[''access_key_id'']}}'
        - '{{$.inputs.parameters[''secret_access_key'']}}'
        - '{{$.outputs.artifacts[''publish_result''].path}}'
        command:
        - python3
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-select-model:
      container:
        args:
        - 'import json,sys;metrics=json.load(open(sys.argv[1]));f1=metrics[''f1_weighted''];decision={''selected'':
          f1 >= float(sys.argv[3]), ''f1_weighted'': f1, ''model_dir'': sys.argv[2]};json.dump(decision,
          open(sys.argv[4], ''w''), indent=2)'
        - '{{$.inputs.artifacts[''metrics''].path}}'
        - '{{$.inputs.artifacts[''model_artifacts''].path}}'
        - '{{$.inputs.parameters[''minimum_f1_weighted'']}}'
        - '{{$.outputs.artifacts[''decision''].path}}'
        command:
        - python3
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-smoke-test-serving:
      container:
        args:
        - "import json,sys,urllib.request;result=json.load(open(sys.argv[1]));out={'selected':\
          \ result['selected'], 'published': result['published'], 'tested': False};\n\
          if result['published']:\n    payload=json.dumps({'app_name':'kubeflow-pipeline-smoke-test','restart_count':3,'cpu_usage_pct':58.0,'memory_usage_pct':97.0,'pod_ready':0,'last_exit_code':137,'waiting_reason':'OOMKilled','oom_killed_count':2,'image_pull_errors':0,'failed_scheduling_events':0,'readiness_probe_failures':2}).encode();req=urllib.request.Request(sys.argv[2],\
          \ data=payload, headers={'Content-Type':'application/json'});resp=urllib.request.urlopen(req,\
          \ timeout=20);out.update({'tested': True, 'status': resp.status, 'response':\
          \ resp.read().decode('utf-8')[:1000]})\njson.dump(out, open(sys.argv[3],\
          \ 'w'), indent=2)"
        - '{{$.inputs.artifacts[''publish_result''].path}}'
        - '{{$.inputs.parameters[''predict_url'']}}'
        - '{{$.outputs.artifacts[''smoke_test_result''].path}}'
        command:
        - python3
        - -c
        image: ttl.sh/failure-model-training-baseline-20260610:24h
    exec-train-model:
      container:
        args:
        - src/train_failure_model.py
        - --data
        - '{{$.inputs.artifacts[''prepared_data''].path}}'
        - --output-dir
        - '{{$.outputs.artifacts[''model_artifacts''].path}}'
        - --feature-set
        - '{{$.inputs.parameters[''feature_set'']}}'
        - --run-name
        - '{{$.inputs.parameters[''run_name'']}}'
        - --tracking-uri
        - '{{$.inputs.parameters[''tracking_uri'']}}'
        - --n-estimators
        - '{{$.inputs.parameters[''n_estimators'']}}'
        command:
        - python3
        image: ttl.sh/failure-model-training-baseline-20260610:24h
pipelineInfo:
  name: kubernetes-failure-prediction
root:
  dag:
    tasks:
      deploy-inferenceservice:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-deploy-inferenceservice
        dependentTasks:
        - prepare-deployment
        - publish-selected-model
        inputs:
          artifacts:
            publish_result:
              taskOutputArtifact:
                outputArtifactKey: publish_result
                producerTask: publish-selected-model
          parameters:
            inferenceservice_name:
              componentInputParameter: inferenceservice_name
            namespace:
              componentInputParameter: serving_namespace
        taskInfo:
          name: deploy-inferenceservice
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - train-model
        inputs:
          artifacts:
            model_artifacts:
              taskOutputArtifact:
                outputArtifactKey: model_artifacts
                producerTask: train-model
        taskInfo:
          name: evaluate-model
      prepare-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-data
        inputs:
          parameters:
            source_data_path:
              componentInputParameter: source_data_path
        taskInfo:
          name: prepare-data
      prepare-deployment:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-deployment
        dependentTasks:
        - select-model
        - train-model
        inputs:
          artifacts:
            decision:
              taskOutputArtifact:
                outputArtifactKey: decision
                producerTask: select-model
            model_artifacts:
              taskOutputArtifact:
                outputArtifactKey: model_artifacts
                producerTask: train-model
          parameters:
            bucket:
              componentInputParameter: model_bucket
            model_object_prefix:
              componentInputParameter: model_object_prefix
        taskInfo:
          name: prepare-deployment
      publish-selected-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-publish-selected-model
        dependentTasks:
        - select-model
        - train-model
        inputs:
          artifacts:
            decision:
              taskOutputArtifact:
                outputArtifactKey: decision
                producerTask: select-model
            model_artifacts:
              taskOutputArtifact:
                outputArtifactKey: model_artifacts
                producerTask: train-model
          parameters:
            access_key_id:
              componentInputParameter: s3_access_key_id
            bucket:
              componentInputParameter: model_bucket
            endpoint_url:
              componentInputParameter: s3_endpoint_url
            model_object_prefix:
              componentInputParameter: model_object_prefix
            secret_access_key:
              componentInputParameter: s3_secret_access_key
        taskInfo:
          name: publish-selected-model
      select-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-select-model
        dependentTasks:
        - evaluate-model
        - train-model
        inputs:
          artifacts:
            metrics:
              taskOutputArtifact:
                outputArtifactKey: metrics
                producerTask: evaluate-model
            model_artifacts:
              taskOutputArtifact:
                outputArtifactKey: model_artifacts
                producerTask: train-model
          parameters:
            minimum_f1_weighted:
              componentInputParameter: minimum_f1_weighted
        taskInfo:
          name: select-model
      smoke-test-serving:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-smoke-test-serving
        dependentTasks:
        - deploy-inferenceservice
        - publish-selected-model
        inputs:
          artifacts:
            publish_result:
              taskOutputArtifact:
                outputArtifactKey: publish_result
                producerTask: publish-selected-model
          parameters:
            predict_url:
              componentInputParameter: predict_url
        taskInfo:
          name: smoke-test-serving
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - prepare-data
        inputs:
          artifacts:
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_data
                producerTask: prepare-data
          parameters:
            feature_set:
              componentInputParameter: feature_set
            n_estimators:
              componentInputParameter: n_estimators
            run_name:
              componentInputParameter: run_name
            tracking_uri:
              componentInputParameter: tracking_uri
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      feature_set:
        defaultValue: events
        isOptional: true
        parameterType: STRING
      inferenceservice_name:
        defaultValue: failure-model
        isOptional: true
        parameterType: STRING
      minimum_f1_weighted:
        defaultValue: 0.8
        isOptional: true
        parameterType: NUMBER_DOUBLE
      model_bucket:
        defaultValue: mlops-models
        isOptional: true
        parameterType: STRING
      model_object_prefix:
        defaultValue: failure-model/events
        isOptional: true
        parameterType: STRING
      n_estimators:
        defaultValue: 200.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      predict_url:
        defaultValue: http://failure-model-api.mlops-poc.svc.cluster.local/predict
        isOptional: true
        parameterType: STRING
      run_name:
        defaultValue: kubeflow-random-forest-events
        isOptional: true
        parameterType: STRING
      s3_access_key_id:
        defaultValue: minioadmin
        isOptional: true
        parameterType: STRING
      s3_endpoint_url:
        defaultValue: http://minio.mlops-poc.svc.cluster.local:9000
        isOptional: true
        parameterType: STRING
      s3_secret_access_key:
        defaultValue: minioadmin
        isOptional: true
        parameterType: STRING
      serving_namespace:
        defaultValue: mlops-poc
        isOptional: true
        parameterType: STRING
      source_data_path:
        defaultValue: data/kubernetes_failures.csv
        isOptional: true
        parameterType: STRING
      tracking_uri:
        defaultValue: http://mlflow.mlops-poc.svc.cluster.local:5000
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
